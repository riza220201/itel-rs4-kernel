# ═══════════════════════════════════════════════════════════════════════════════
# sources.lock — pinned commit set for REPRODUCIBLE builds
#
# The single source of truth for every out-of-tree source the variants pull. Each
# apply-*.sh (and package.sh) sources this file, so what a variant IS is fixed here,
# not by whatever a branch tip happens to be on the day you build. Change a value
# ONLY deliberately — bumping a SHA changes what the variant is, and the build gates
# (KMI + the version-drift checks below) re-verify on the next build.
#
# The `common` kernel source is pinned separately, as a git submodule (.gitmodules
# gitlink; KERNEL_COMMON below records it). Listed here for the record.
# ═══════════════════════════════════════════════════════════════════════════════

# ── kernel source + toolchain (informational; enforced elsewhere) ───────────────
KERNEL_COMMON="8059ae219630120955ce6281668ffa709fd87521"   # common submodule — GKI android12-5.10-lts @ 5.10.272 (2026-10-24; .269 f5a30e5a is an ancestor, +1,447 commits)
CLANG_VER="neutron-clang-06092026"                          # Neutron clang 24.0.0git, llvm f42c87ba (fetch-toolchain.sh; sha256-pinned). Since v9; was clang-r416183b (AOSP clang 12.0.5, MTK stock) — any clang >= 14 needs build.sh's stack-guard pin

# ── ksunext variant: KernelSU-Next v3.4.2 "Wild" (dev-susfs) + SusFS v2.3.0 ──────
# WILDKSU_REF is the EXACT commit the driver is built from (was the moving `dev-susfs`
# branch — that drift was the whole point of pinning). WILDKSU_VERBASE is the version
# anchor: 30000 + rev-count(VERBASE) is the KSU version the kernel reports, which the
# manager APK must be >=. apply-ksunext-susfs.sh recomputes it and DIES on any drift
# from WILDKSU_VER_EXPECT, so the reported version and the installer banner can't
# disagree (that was a latent bug).
WILDKSU_REF="d21e0a66c887ae4bc75b7c9f83e41761819ec09a"       # pershoot/KernelSU-Next dev-susfs @ this commit (2026-10-19; v3.4.2 + 50 upstream dev = b427a3f9 + 13 Wild: 9 Wild + 4 Samsung KDP/RKP/DEFEX compat, inert off Samsung DTs). dev-susfs was REBASED again: v8's a0dfdb86 is on no branch; both kept as local branches rs4-pin-v8 / rs4-pin-20261028
WILDKSU_VERBASE="b427a3f9c2421a443f961007bfce66b25486643f"   # merge-base w/ dev (= upstream KernelSU-Next dev head 2026-10-19, = what Wild's own Kbuild counts); v3.4.2 (4c706b59) is its ancestor
WILDKSU_VER_EXPECT="33405"                                   # 30000 + rev-count(WILDKSU_VERBASE); must match at build
SUSFS_REF="0cd7353436d2817785ae449109ea08d633ee6bb2"         # simonpunk gki-android12-5.10 @ eb95da08 (2026-10-27, SusFS v2.3.0, +13: UAF/selinux-leak fixes, priority uid filter) + our 2 picks rebased clean; local branch rs4-susfs-20261028 in .build/susfs-wild

# ── kowsu variant: KOWX712/KernelSU standalone (own hiding, no SusFS) ────────────
# Pin to a CURRENT KOWX712 master commit so the kernel version matches the manager
# users actually download. The old "pin low (v3.2.5=32525) so any newer manager works"
# theory was WRONG: the current manager (32579) will NOT bind a stale 32525 driver →
# users got "Not installed" (reported on v2). This commit == the manager build
# `v3.2.5-54-gcfac3be3` (32579) — kernel + manager from the SAME source commit.
# RE-BUMP when KOWX712 moves master and the distributed manager moves with it.
KOWSU_REF="6366f25b89f2bc5e287c1983715ebae60cd5540e"         # KOWX712/KernelSU master 2026-10-25 "manager: translation squash" (v3.3.0-136-g6366f25b; master FORCE-PUSHED again over 024d5f4a (32712); = KOWX712's newest manager CI build, run 455; local branch rs4-pin-20261028)
KOWSU_VER_EXPECT="32737"                                     # 30000 + rev-count(KOWSU_REF); manager must match this
