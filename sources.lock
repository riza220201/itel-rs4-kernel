# ═══════════════════════════════════════════════════════════════════════════════
# sources.lock — pinned commit set for REPRODUCIBLE builds
#
# The single source of truth for every out-of-tree source the variants pull. Each
# apply-*.sh (and package.sh) sources this file, so what a variant IS is fixed here,
# not by whatever a branch tip happens to be on the day you build. Change a value
# ONLY deliberately — bumping a SHA changes what the variant is, and the build gates
# (KMI + the version-drift checks below) re-verify on the next build.
#
# The `common` kernel source is pinned separately, as a git submodule (.gitmodules
# → af99d873 = Google GKI android12-5.10-lts @ 5.10.260). Listed here for the record.
# ═══════════════════════════════════════════════════════════════════════════════

# ── kernel source + toolchain (informational; enforced elsewhere) ───────────────
KERNEL_COMMON="f5a30e5a3ab83709e886d3efc199e01beda06b7e"   # common submodule — GKI android12-5.10-lts @ 5.10.269
CLANG_VER="clang-r416183b"                                  # AOSP clang 12.0.5 (fetch-toolchain.sh)

# ── ksunext variant: KernelSU-Next v3.4.0 "Wild" (dev-susfs) + SusFS v2.3.0 ──────
# WILDKSU_REF is the EXACT commit the driver is built from (was the moving `dev-susfs`
# branch — that drift was the whole point of pinning). WILDKSU_VERBASE is the version
# anchor: 30000 + rev-count(VERBASE) is the KSU version the kernel reports, which the
# manager APK must be >=. apply-ksunext-susfs.sh recomputes it and DIES on any drift
# from WILDKSU_VER_EXPECT, so the reported version and the installer banner can't
# disagree (that was a latent bug).
WILDKSU_REF="d575262c1b40180a0f915544f42d8c4ab34b874b"      # pershoot/KernelSU-Next dev-susfs @ this commit (v3.4.0 + upstream dev c61d8764 + 8 Wild)
WILDKSU_VERBASE="c61d876480976e553060789759cc4b54c9e7d816"  # merge-base w/ dev (= what Wild's own Kbuild counts); v3.4.0 is its ancestor
WILDKSU_VER_EXPECT="33312"                                   # 30000 + rev-count(WILDKSU_VERBASE); must match at build
SUSFS_REF="f72681ec08e705d5bfe3d179e116e3c79c5f8fa9"         # simonpunk gki-android12-5.10 @ 9892175 (SusFS v2.3.0, +26 fixes) + our 2 picks (== pershoot's 6.1 picks)

# ── kowsu variant: KOWX712/KernelSU standalone (own hiding, no SusFS) ────────────
# Pin to a CURRENT KOWX712 master commit so the kernel version matches the manager
# users actually download. The old "pin low (v3.2.5=32525) so any newer manager works"
# theory was WRONG: the current manager (32579) will NOT bind a stale 32525 driver →
# users got "Not installed" (reported on v2). This commit == the manager build
# `v3.2.5-54-gcfac3be3` (32579) — kernel + manager from the SAME source commit.
# RE-BUMP when KOWX712 moves master and the distributed manager moves with it.
KOWSU_REF="0ffda30c29bdccf913355c5e06f49001e685530c"         # KOWX712/KernelSU TAG v3.3.0-37 (still the newest tag, 2026-09-28)
KOWSU_VER_EXPECT="32638"                                     # 30000 + rev-count(KOWSU_REF); manager must match this
