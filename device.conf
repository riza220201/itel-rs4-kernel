# ═══════════════════════════════════════════════════════════════════════════════
# device.conf — device-specific KMI target (+ optional paths) for build.sh
#
# This is what makes the tool device-agnostic. build.sh sources this file at
# startup and REFUSES TO BUILD if MODULE_LAYOUT below is empty or not a valid CRC —
# set it for YOUR device first. (This repo ships it filled for the Itel RS4.)
# ═══════════════════════════════════════════════════════════════════════════════

# ── REQUIRED: your device's KMI `module_layout` CRC ────────────────────────────
# On a GKI device, the prebuilt vendor_dlkm modules only load against ONE exact
# kernel ABI, fingerprinted by this `module_layout` CRC. Build a kernel whose
# module_layout ≠ this and every vendor module refuses to load → the device boots
# nothing (no storage/display/radio). The build gate reproduces this value or dies.
#
#   This repo's device — Itel RS4 (S666LN / MT6789 / Helio G99) = 0x7c24b32d
#   ►► CHANGE IT for your device. ◄◄
#
# HOW TO OBTAIN YOURS — read it off the device's OWN stock vendor modules (that's
# the ABI your kernel must match). Any one vendor_dlkm .ko carries it:
#
#   # from a pulled stock vendor_dlkm/*.ko (needs kmod's modprobe):
#   modprobe --dump-modversions <any_vendor_module>.ko | awk '$2=="module_layout"{print $1}'
#
#   # or straight off the running stock kernel (rooted / adb):
#   grep -m1 '\bmodule_layout\b' /proc/kallsyms   # symbol addr, not the CRC — prefer the .ko method
#
#   # or, if you already built once, from the build's symvers:
#   awk '$2=="module_layout"{print $1}' .build/out-<variant>/vmlinux.symvers
#
# All the vendor .ko share the same module_layout CRC — grab it from any of them.
MODULE_LAYOUT="0x7c24b32d"

# ── DEVICE IDENTITY: branding + AnyKernel3 + installer banner ──────────────────
# All optional (build.sh ships Itel-RS4 defaults). Change these for your device —
# they drive the kernel brand string, the AnyKernel3 device.name allowlist, the
# installer banner, and the release file names (<slug>-boot/-Kernel-…).
DEVICE_LABEL="Itel RS4"                            # human name (banners, installer, file prefix "ItelRS4")
DEVICE_SOC="MediaTek MT6789 · Helio G99"           # SoC line shown in the installer banner
DEVICE_NAMES="S666LN itel-S666LN RS4 Itel-S666LN"  # AnyKernel3 device.name1..N (space-separated)
BRAND="Riza"                                       # LOCALVERSION → 5.10.x-<BRAND>-<variant>

# ── KERNEL FORMAT: how your stock boot.img stores the kernel (--pack repack) ────
# MUST match your stock boot.img or the repacked boot.img won't boot. gzip is the
# MTK / most-common default. Check with `magiskboot unpack boot.img` (prints the fmt).
KERNEL_FMT="gzip"                                  # gzip | lz4 | raw

# ── OPTIONAL: stock vendor_dlkm .ko dir for the FULL CRC cross-check ────────────
# The gate cross-checks every exported symbol the vendor modules reference (strongest
# guarantee — catches ABI breaks a matching module_layout alone can miss). build.sh
# defaults to the local .build/vendor_dlkm/ — drop your device's stock vendor_dlkm
# *.ko there (pull them off the vendor partition or a factory image). If that dir is
# absent, the gate does the module_layout check only and warns.
# VENDOR_KO_DIR="/path/to/stock/vendor_dlkm"        # override the default .build/vendor_dlkm

# ── OPTIONAL BUT RECOMMENDED: assert the PROVENANCE of that reference set ──────
# 🔴 THE REFERENCE SET IS AN INPUT, AND AN INPUT CAN GO STALE SILENTLY.
# The CRC gate answers "will my kernel load THESE modules". It cannot notice that
# "these" stopped being the modules the device ships. On 2026-09-03 that is what
# had happened here: the reference directory still held the module set that was
# replaced on 2026-09-02, so a healthy `ok=198 bad=0` was measured against
# modules nobody ships. Both sets passed — nothing was misjudged — but a gate
# wired to a stale input cannot fail, and reports a pass in the artefact's name.
#
# So state what the reference set is SUPPOSED to be. Every module in it must
# carry this vermagic prefix; anything else aborts the build as a wrong
# reference set (exit 3) instead of being quietly measured.
#
#   Get yours from any stock vendor module:
#     modprobe --dump-modinfo <any_vendor_module>.ko | sed -n 's/^vermagic=//p'
#
# This device pins stock revision 28 (build 251212V1661).
export KMI_EXPECT_VERMAGIC="5.10.237-android12-9-gf280f42a626b"

# Modules you build YOURSELF, and therefore expect to carry a different vermagic.
# Keep this list short and justify each one — it is a hole in the check above.
#   mali_kbase_mt6789.ko  Mali r54p1 kbase, compiled against our own kernel.
export KMI_VERMAGIC_EXCEPTIONS="mali_kbase_mt6789.ko"

# ── OPTIONAL: device/build paths ───────────────────────────────────────────────
# Leave unset to use build.sh's Itel-RS4 defaults, set here for your device, or
# override per-run with env vars (e.g. `KERNEL_SRC=/path ./build.sh vanilla`).
# KERNEL_SRC="/path/to/kernel-source"     # the kernel tree to build
# STOCK_CONFIG="/path/to/stock.config"    # base defconfig (must have CONFIG_CFI_CLANG=y)
# BOOT_IMG="/path/to/stock/boot.img"      # stock boot.img to repack (for --pack)
